name: AI Governance Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

# Permissions mirror the reusable workflow's declared permissions exactly.
# GitHub requires the caller to grant at minimum what the reusable workflow
# declares; removing any of these causes startup_failure.
permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write

jobs:
  governance-review:
    # Pinned to SHA e2bc891 (ai-control-plane main, 2026-06-12).
    # Declares workflow_call secrets explicitly — required for public repos
    # calling private reusable workflows (secrets: inherit is blocked by GitHub).
    uses: terrapayx/ai-control-plane/.github/workflows/ai-pr-review-reusable.yml@e2bc891c018cb315edd88e42b1f64c795bfc216c
    with:
      domain: website
    secrets:
      GH_CONTROL_PLANE_READ_TOKEN: ${{ secrets.GH_CONTROL_PLANE_READ_TOKEN }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
