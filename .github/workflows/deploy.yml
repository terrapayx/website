name: Deploy Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy to S3
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Gates placed BEFORE the build, so a failure stops the deploy rather than
      # being reported after the site is already live. This repo deploys on push
      # to main, which makes these steps the only thing standing between a broken
      # commit and production.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Observation examples conform to the canonical contract
        run: npm run verify:observation

      - name: Build static site
        run: npm run build
        env:
          # Inlined into the static export at build time (see .env.example). Set the
          # repo variable to the live Starter Kit payment link; when unset, the CTA
          # falls back to /contact (never a fabricated URL). Scope: G7 only.
          NEXT_PUBLIC_STARTER_KIT_PAYMENT_URL: ${{ vars.NEXT_PUBLIC_STARTER_KIT_PAYMENT_URL }}
          # RI-3B / FOP-1. This line is the fix for FRPE-RR blocker B3: the
          # variable existed and was documented in .env.example, but was NEVER
          # PASSED TO THE BUILD — and this is a static export, so NEXT_PUBLIC_*
          # values are inlined at BUILD time. Setting the repository variable
          # alone therefore changed nothing; the obvious fix was not a fix.
          # When unset the observation layer falls back to console.debug, which
          # is the E1 condition ("appears to observe, retains nothing").
          # Set to: https://terrapayx.com/o
          NEXT_PUBLIC_OBSERVATION_ENDPOINT: ${{ vars.NEXT_PUBLIC_OBSERVATION_ENDPOINT }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync assets to S3 (long-lived cache)
        run: |
          aws s3 sync out/ s3://${{ secrets.S3_BUCKET_NAME }} \
            --delete \
            --cache-control "public, max-age=31536000" \
            --exclude "*.html"

      - name: Sync HTML to S3 (no-cache)
        run: |
          aws s3 sync out/ s3://${{ secrets.S3_BUCKET_NAME }} \
            --delete \
            --cache-control "public, max-age=0, must-revalidate" \
            --exclude "*" \
            --include "*.html"

      - name: Invalidate CloudFront distribution
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
